spring.application.name=auth-service

server.port=${PORT:8081}

spring.datasource.url=jdbc:mysql://localhost:3306/medsync_auth
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=https://medsync-eureka.onrender.com/eureka/
eureka.instance.prefer-ip-address=false

jwt.secret=${JWT_SECRET:medsync-super-secret-key-change-in-production-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


eureka.instance.hostname=medsync-auth.onrender.com
eureka.instance.non-secure-port=80
eureka.instance.secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false